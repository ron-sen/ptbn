[project]
name = "sentrix-io"
version = "0.1.0"
description = ""
authors = [
    {name = "ron-sen",email = "ronsen.in02@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "shell (>=1.0.1,<2.0.0)",
    "fastapi[all] (>=0.135.2,<0.136.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pwdlib (>=0.3.0,<0.4.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "bcrypt (==3.2.0)",
    "passlib[bcrypt] (==1.7.4)",
    "authlib (>=1.7.0,<2.0.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "numpy (>=2.2.0,<3.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "scikit-learn (>=1.6.0,<2.0.0)",
    "starlette (>=1.0.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "fastapi-mail (>=1.6.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "nsepython (>=2.97,<3.0)",
    "yfinance (>=1.6.0,<2.0.0)",
    "matplotlib (<3.11)",
    "scikit-fuzzy (>=0.5.0,<0.6.0)",
    "networkx (<3.3)",
    "streamlit (>=1.64.0,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.3,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]
